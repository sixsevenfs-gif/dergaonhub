# Netlify settings (used when the site builds from GitHub).
[build]
  command = "npm run build"
  publish = "dist"

# Product photos from Supabase may go through Netlify's image service: smaller WebP, cached (src/lib/img.js).
[images]
  remote_images = ["https://nyzwehemganasxwcxeai\\.supabase\\.co/storage/v1/object/public/.*"]

# Every address opens the app (it shows the right page); real files such as /policy/about.html come first.
# public/_redirects says the same for Netlify (Cloudflare Pages does this on its own and skips that rule).
# Netlify still answers for jholzo.com wherever old DNS is cached, until the old nameservers expire.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
